services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-text_annotation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment: &backend-environment
      POSTGRES_DB: ${POSTGRES_DB:-text_annotation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: sh -c "python manage.py migrate && python manage.py create_roles && python manage.py runserver 0.0.0.0:8000 --noreload"
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
      - filepond_uploads:/app/filepond-temp-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
    environment: *backend-environment
    command: celery -A backend.celery worker --loglevel=INFO --concurrency=1
    volumes:
      - backend_media:/app/media
      - filepond_uploads:/app/filepond-temp-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./textAnnotationFrontend
    environment:
      BASE_URL: http://localhost:8000
      SOCKET_URL: http://localhost:3001
    ports:
      - "8088:8088"
    depends_on:
      - backend

  socketserver:
    build:
      context: ./socketserver
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
  backend_media:
  filepond_uploads:
